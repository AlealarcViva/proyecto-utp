<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacantes UTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #7A1230;
    --yellow: #C99A1F;
    --red-dark: #560B22;
    --ink: #101012;
    --ink-soft: #2B2B2E;
    --paper: #F7F6F3;
    --paper-dim: #EEECE6;
    --line: #DAD7CE;
    --white: #FFFFFF;
    --blue: #101012;
    --blue-dark: #000000;
    --gray: #7A7873;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-mark{
    height: 40px;
    width: auto;
    display:block;
    object-fit: contain;
  }
  .brand-divider{
    width: 1.5px;
    height: 32px;
    background: var(--line);
  }
  .brand-title{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: .5px;
    font-size: 22px;
    line-height: 1;
  }
  .brand-title small{
    display:block;
    font-family:'Inter',sans-serif;
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--gray);
    font-weight:600;
    text-transform: uppercase;
    margin-top:3px;
  }

  .crumbs{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 13px;
    font-weight:600;
    color: var(--gray);
    flex-wrap: wrap;
  }
  .crumbs button{
    background:none;border:none;cursor:pointer;
    color: var(--gray);
    font: inherit;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .crumbs button:hover{ background: var(--paper-dim); color: var(--ink); }
  .crumbs .current{ color: var(--ink); }
  .crumbs .sep{ color: var(--line); }

  /* ---------- Headline block ---------- */
  .headline{
    margin-bottom: 26px;
  }
  .eyebrow{
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 8px;
  }
  h1{
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 42px;
    letter-spacing: .3px;
    line-height: 1.02;
    margin: 0 0 8px;
  }
  .sub{
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 620px;
    line-height: 1.5;
  }

  /* ---------- Screen fade ---------- */
  .screen{ animation: fadeUp .35s ease; }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---------- Faculty grid ---------- */
  .fac-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media(max-width: 760px){ .fac-grid{ grid-template-columns: repeat(2,1fr);} }
  @media(max-width: 460px){ .fac-grid{ grid-template-columns: 1fr;} }

  .fac-btn{
    position:relative;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 16px 18px;
    text-align:left;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    display:flex;
    flex-direction:column;
    gap: 14px;
    min-height: 118px;
  }
  .fac-btn:hover{
    transform: translateY(-3px);
    border-color: var(--red);
    box-shadow: 0 10px 22px rgba(200,16,46,.12);
  }
  .fac-btn:focus-visible{
    outline: 3px solid var(--blue);
    outline-offset: 2px;
  }
  .fac-emoji{
    font-size: 26px;
    width: 46px; height:46px;
    border-radius: 10px;
    background: var(--paper);
    display:flex; align-items:center; justify-content:center;
  }
  .fac-name{
    font-weight: 800;
    font-size: 16px;
    line-height:1.15;
  }
  .fac-count{
    font-size: 12px;
    color: var(--gray);
    font-weight:600;
  }
  .fac-btn .arrow{
    position:absolute; top:18px; right:18px;
    color: var(--line);
    font-size: 18px;
    transition: color .15s ease, transform .15s ease;
  }
  .fac-btn:hover .arrow{ color: var(--red); transform: translateX(2px); }

  /* ---------- Sede tabs ---------- */
  .sedetabs{
    display:flex;
    gap:8px;
    margin-bottom: 14px;
    flex-wrap:wrap;
  }
  .sedetab{
    border: 1.5px solid var(--line);
    background: var(--paper-dim);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all .15s ease;
  }
  .sedetab:hover{ border-color: var(--red); }
  .sedetab.active{
    background: var(--red);
    border-color: var(--red);
    color: var(--white);
  }

  /* ---------- Modality tabs ---------- */
  .modtabs{
    display:flex;
    gap:8px;
    margin-bottom: 22px;
    flex-wrap:wrap;
  }
  .modtab{
    border: 1.5px solid var(--line);
    background: var(--white);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all .15s ease;
  }
  .modtab:hover{ border-color: var(--red); }
  .modtab.active{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--white);
  }
  .modtab .dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:7px; vertical-align:middle;
  }
  .modtab[data-mod="presencial"] .dot{ background:var(--ink); }
  .modtab[data-mod="semipresencial"] .dot{ background:var(--gray); }
  .modtab[data-mod="virtual"] .dot{ background:var(--blue); }

  /* ---------- Career list ---------- */
  .career-list{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media(max-width: 640px){ .career-list{ grid-template-columns: 1fr; } }

  .career-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 15px 16px;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .career-card:hover{ border-color: var(--red); transform: translateX(2px); }
  .career-card .name{ font-weight:700; font-size: 14.5px; }
  .career-card .chev{ color: var(--line); }
  .career-card:hover .chev{ color:var(--red); }

  .empty-note{
    padding: 30px 20px;
    text-align:center;
    color: var(--gray);
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    font-size: 14px;
  }

  /* ---------- Schedule list ---------- */
  .sched-list{ display:flex; flex-direction:column; gap:10px; }
  .sched-card{
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .sched-card:hover{ border-color: var(--red); transform: translateX(2px); }
  .sched-card .label{ font-weight:800; font-size:15px; margin-bottom:4px; }
  .sched-card .detail{ font-size:13px; color: var(--gray); line-height:1.4; }
  .sched-card .seats-left{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight:700;
    padding: 5px 10px;
    border-radius: 999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .seats-left.ok{ background:var(--paper-dim); color:var(--ink-soft); }
  .seats-left.low{ background:#F3E3E7; color:var(--red-dark); }

  /* ---------- Classroom / seat map ---------- */
  .room-wrap{
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 30px 24px 26px;
  }
  .board{
    margin: 0 auto 34px;
    max-width: 420px;
    text-align:center;
  }
  .board-shape{
    height: 10px;
    background: linear-gradient(90deg, transparent, var(--ink) 15%, var(--ink) 85%, transparent);
    border-radius: 2px;
    margin-bottom: 10px;
    box-shadow: 0 8px 18px rgba(0,0,0,.15);
  }
  .board-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--gray);
    font-weight:600;
  }

  .seat-grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px 14px;
    max-width: 420px;
    margin: 0 auto;
  }
  .seat{
    position:relative;
    aspect-ratio: 1/1;
    border: none;
    background: none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .12s ease, opacity .15s ease;
  }
  .seat-icon{
    width: 34px;
    height: 34px;
    transition: transform .12s ease, color .15s ease;
  }
  .seat.available .seat-icon{ color: var(--line); }
  .seat.occupied .seat-icon{ color: var(--red); }
  .seat.reserved .seat-icon{ color: var(--yellow); }
  .seat.selected .seat-icon{ color: var(--ink); }
  .seat.available:hover .seat-icon{
    color: var(--ink);
    transform: scale(1.12);
  }
  .seat.reserved:hover .seat-icon{
    transform: scale(1.12);
  }
  .seat.occupied{ cursor: not-allowed; }
  .seat.reserved{ cursor: pointer; }
  .seat.selected .seat-icon{
    transform: scale(1.15);
  }
  .seat.payment-picked .seat-icon{
    transform: scale(1.2);
    filter: drop-shadow(0 0 0 var(--yellow));
  }
  .seat.payment-picked{
    outline: 2.5px dashed var(--yellow);
    outline-offset: 4px;
    border-radius: 50%;
  }
  .seat:focus-visible{ outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

  .legend{
    display:flex;
    justify-content:center;
    gap: 22px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .legend-item{
    display:flex; align-items:center; gap:8px;
    font-size: 12.5px;
    font-weight:600;
    color: var(--ink-soft);
  }
  .legend-swatch{
    width:16px; height:16px;
  }
  .legend-swatch.available{ color: var(--line); }
  .legend-swatch.occupied{ color: var(--red); }
  .legend-swatch.reserved{ color: var(--yellow); }
  .legend-swatch.selected{ color: var(--ink); }

  .room-meta{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 16px;
    margin-bottom: 6px;
    flex-wrap:wrap;
  }
  .room-meta h2{
    font-family:'Bebas Neue', sans-serif;
    font-weight:400;
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing:.3px;
  }
  .room-meta .meta-detail{
    font-size: 13px;
    color: var(--gray);
    max-width: 480px;
    line-height:1.45;
  }
  .room-code{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:700;
    background: var(--ink);
    color: var(--white);
    padding: 6px 12px;
    border-radius: 999px;
    white-space:nowrap;
  }

  .confirm-bar{
    margin-top: 26px;
    border-top: 1.5px dashed var(--line);
    padding-top: 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .confirm-info{
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .confirm-info strong{ color: var(--ink); }
  .confirm-btn{
    background: var(--ink);
    color: var(--white);
    border:none;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 13.5px;
    cursor:pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .confirm-btn:hover:not(:disabled){ background: var(--red); transform: translateY(-1px); }
  .confirm-btn:disabled{ background: var(--line); color: var(--gray); cursor:not-allowed; }
  .confirm-btn.pay-btn{ background: var(--yellow); color: var(--ink); }
  .confirm-btn.pay-btn:hover{ background: var(--red); color: var(--white); }

  .toast{
    position:fixed;
    left:50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--white);
    padding: 13px 22px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    box-shadow: 0 12px 28px rgba(0,0,0,.25);
    z-index: 50;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color: var(--gray);
    font-weight:700;
    font-size: 13px;
    cursor:pointer;
    padding: 6px 2px;
    margin-bottom: 14px;
  }
  .back-link:hover{ color: var(--ink); }
</style>
</head>

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
const state = {
  view: 'faculties',      // faculties | careers | schedules | room
  facultyId: null,
  modality: 'presencial',
  sede: 'Lima Centro',
  careerName: null,
  scheduleId: null,
  selectedSeat: null,
  selectedPayment: null,
  rooms: {},              // key -> {occupied:Set, reserved:Set, code, total, reservedUntil}
  activeRoomKey: null,    // key del salón que se está viendo ahora mismo
};

function roomKeyFor(facultyId, careerName, mod, schedId, sede){
  return facultyId+'|'+careerName+'|'+mod+'|'+schedId+'|'+sede;
}

const HOLD_MINUTES = 20;
const HOLD_MS = HOLD_MINUTES * 60 * 1000;

// Crea (si no existe) y devuelve el salón para esta combinación de carrera/sede/horario.
function getOrCreateRoom(key){
  if(state.rooms[key]) return state.rooms[key];
  const total = 30;
  const minFree = 5;
  const maxFree = 8;
  const freeCount = Math.floor(Math.random() * (maxFree - minFree + 1)) + minFree; // 5 a 8 libres (gris)
  const remaining = total - freeCount;
  const extra = Math.floor(Math.random() * 3) + 1; // cuánto más ocupadas que reservadas (1 a 3)
  const reservedCount = Math.floor((remaining - extra) / 2);
  const occupiedCount = remaining - reservedCount; // siempre un poco más que reservadas
  const indices = Array.from({length: total}, (_, i) => i);
  for(let i = indices.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  const occupied = new Set(indices.slice(0, occupiedCount));
  const reserved = new Set(indices.slice(occupiedCount, occupiedCount + reservedCount));
  const code = 'A-' + (100 + Math.floor(Math.random()*800));
  const room = { occupied, reserved, reservedUntil: {}, code, total };
  state.rooms[key] = room;
  return room;
}

// Reserva una vacante libre y le pone un cronómetro de HOLD_MINUTES para pagar.
function reserveSeat(key, idx){
  const room = state.rooms[key];
  if(!room) return false;
  if(room.occupied.has(idx) || room.reserved.has(idx)) return false;
  room.reserved.add(idx);
  room.reservedUntil[idx] = Date.now() + HOLD_MS;
  return true;
}

// Confirma el pago de una vacante reservada: pasa de "reservado" a "ocupado",
// se le quita el cronómetro y queda bloqueada para siempre.
function confirmPayment(key, idx){
  const room = state.rooms[key];
  if(!room || !room.reserved.has(idx)) return false;
  room.reserved.delete(idx);
  delete room.reservedUntil[idx];
  room.occupied.add(idx);
  return true;
}

// Si el cronómetro de una vacante reservada ya llegó a 0 y nadie confirmó el pago,
// la libera de vuelta a disponible.
function releaseExpiredSeat(key, idx){
  const room = state.rooms[key];
  if(!room) return;
  room.reserved.delete(idx);
  delete room.reservedUntil[idx];
}

function formatMMSS(ms){
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// Se ejecuta cada segundo: actualiza el texto del cronómetro visible y libera
// automáticamente cualquier vacante reservada cuyos 20 minutos ya se cumplieron.
function tickCountdowns(){
  const countdownEl = document.getElementById('paymentCountdown');
  if(countdownEl){
    const until = parseInt(countdownEl.getAttribute('data-until'), 10);
    if(until){
      const remaining = until - Date.now();
      countdownEl.innerHTML = remaining <= 0
        ? 'El tiempo para confirmar el pago se agotó.'
        : `Le quedan <strong>${formatMMSS(remaining)}</strong> para confirmar el pago de su inscripción`;
    }
  }

  const key = state.activeRoomKey;
  if(!key) return;
  const room = state.rooms[key];
  if(!room || !room.reservedUntil) return;

  let expiredSomething = false;
  Object.entries(room.reservedUntil).forEach(([idxStr, until]) => {
    if(until <= Date.now()){
      const idx = parseInt(idxStr, 10);
      if(state.selectedPayment === idx){
        state.selectedPayment = null;
        showToast(`El tiempo para pagar la vacante ${String(idx+1).padStart(2,'0')} expiró y quedó liberada`);
      }
      releaseExpiredSeat(key, idx);
      expiredSomething = true;
    }
  });
  if(expiredSomething && state.view === 'room') render();
}
setInterval(tickCountdowns, 1000);

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function getFaculty(id){ return FACULTIES.find(f => f.id === id); }

function careersForModality(faculty, mod, sede){
  return faculty.careers.filter(c => {
    if(!c.mods.includes(mod)) return false;
    if(!c.sedes) return true; // sin datos de sede en el Excel: se muestra en todas
    return c.sedes.includes(sede);
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------------------------------------------------
   RENDER: CRUMBS
--------------------------------------------------------- */
function renderCrumbs(){
  const el = document.getElementById('crumbs');
  const parts = [];
  parts.push(`<button data-nav="faculties">Facultades</button>`);
  if(state.facultyId){
    const f = getFaculty(state.facultyId);
    parts.push(`<span class="sep">/</span>`);
    if(state.view === 'careers'){
      parts.push(`<span class="current">${f.name}</span>`);
    } else {
      parts.push(`<button data-nav="careers">${f.name}</button>`);
    }
  }
  if(state.careerName){
    parts.push(`<span class="sep">/</span>`);
    if(state.view === 'schedules'){
      parts.push(`<span class="current">${state.careerName}</span>`);
    } else {
      parts.push(`<button data-nav="schedules">${state.careerName}</button>`);
    }
  }
  if(state.scheduleId && state.view === 'room'){
    const sched = SCHEDULES[state.modality].find(s => s.id === state.scheduleId);
    parts.push(`<span class="sep">/</span><span class="current">${sched.label}</span>`);
  }
  el.innerHTML = parts.join('');
  el.querySelectorAll('button[data-nav]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const nav = btn.getAttribute('data-nav');
      if(nav === 'faculties'){ state.view='faculties'; state.facultyId=null; state.careerName=null; state.scheduleId=null; }
      if(nav === 'careers'){ state.view='careers'; state.careerName=null; state.scheduleId=null; }
      if(nav === 'schedules'){ state.view='schedules'; state.scheduleId=null; }
      render();
    });
  });
}

   RENDER: SCREENS

    <div class="headline">
      <div class="eyebrow">${faculty.emoji} ${faculty.name}</div>
      <h1>Elegir vacante</h1>

function renderSchedules(){
  const faculty = getFaculty(state.facultyId);
  const scheds = SCHEDULES[state.modality];
  return `
    <button class="back-link" data-back="careers">← ${faculty.name}</button>
    <div class="headline">
      <div class="eyebrow">${MOD_LABEL[state.modality]}</div>
      <h1>${state.careerName}</h1>
      <div class="sub">Seleccione el horario disponible para esta carrera. Cada horario tiene su propio salón con vacantes disponibles.</div>
    </div>
    <div class="sched-list">
      ${scheds.map(s => {
        const key = roomKeyFor(state.facultyId, state.careerName, state.modality, s.id, state.sede);
        const room = getOrCreateRoom(key);
        const free = room.total - room.occupied.size - room.reserved.size;
        return `
        <div class="sched-card" data-sched="${s.id}">
          <div>
            <div class="label">${s.label}</div>
            <div class="detail">${s.detail}</div>
          </div>
          <div class="seats-left ${free<=6?'low':'ok'}">${free} libres</div>

function gradIcon(cls){
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 3 L21 7.4 L12 11.8 L3 7.4 Z"/>
    <rect x="8" y="7.6" width="8" height="3.4" rx="1.7"/>
    <path d="M20.3 7.7 C20.3 9 19.3 9.7 19.3 11.2 C19.3 12.7 20.1 13.1 20.1 13.1" stroke="currentColor" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <circle cx="20.1" cy="13.6" r="0.95"/>
    <circle cx="12" cy="13.2" r="3.4"/>
    <path d="M5 22 C5 17.5 8.2 15.4 12 15.4 C15.8 15.4 19 17.5 19 22 Z"/>
  </svg>`;
}

function renderRoom(){
  const faculty = getFaculty(state.facultyId);
  const sched = SCHEDULES[state.modality].find(s => s.id === state.scheduleId);
  const key = roomKeyFor(state.facultyId, state.careerName, state.modality, state.scheduleId, state.sede);
  state.activeRoomKey = key;
  const room = getOrCreateRoom(key);

  const free = room.total - room.occupied.size - room.reserved.size;

  let seatsHtml = '';
  for(let i=0;i<room.total;i++){
    const num = String(i+1).padStart(2,'0');
    let status = 'available';
    if(room.occupied.has(i)) status = 'occupied';
    else if(room.reserved.has(i)) status = 'reserved';

    let cls = status;
    if(status === 'available' && state.selectedSeat === i) cls = 'selected';
    if(status === 'reserved' && state.selectedPayment === i) cls = 'reserved payment-picked';

    const isLocked = status === 'occupied';
    seatsHtml += `<button class="seat ${cls}" data-seat="${i}" data-status="${status}" ${isLocked?'disabled':''} aria-label="Vacante ${num}">${gradIcon('seat-icon')}</button>`;
  }

  const payIdx = state.selectedPayment;
  let barInfo, barButtons;

  if(state.selectedSeat !== null){
    barInfo = `Vacante seleccionada: <strong>${String(state.selectedSeat+1).padStart(2,'0')}</strong> · ${free} de ${room.total} vacantes libres`;
    barButtons = `<button class="confirm-btn" id="confirmBtn">Confirmar vacante</button>`;
  } else if(payIdx !== null && room.reserved.has(payIdx)){
    const until = room.reservedUntil[payIdx];
    const remainingMs = until ? (until - Date.now()) : HOLD_MS;
    barInfo = `Vacante <strong>${String(payIdx+1).padStart(2,'0')}</strong> reservada · <span id="paymentCountdown" data-until="${until||''}">Le quedan <strong>${formatMMSS(remainingMs)}</strong> para confirmar el pago de su inscripción</span>`;
    barButtons = `<button class="confirm-btn pay-btn" id="confirmPayBtn">Confirmar pago</button>`;
  } else {
    barInfo = `${free} de ${room.total} vacantes libres · seleccione una vacante gris, o toque una amarilla para confirmar su pago`;
    barButtons = `<button class="confirm-btn" id="confirmBtn" disabled>Confirmar vacante</button>`;
  }

  return `
    <button class="back-link" data-back="schedules">← Horarios de ${state.careerName}</button>
    <div class="room-wrap">
      <div class="room-meta">
        <div>
          <h2>${state.careerName}</h2>
          <div class="meta-detail">${faculty.emoji} ${faculty.name} · ${state.sede} · ${MOD_LABEL[state.modality]} · <strong>${sched.label}</strong><br>${sched.detail}</div>
        </div>
        <div class="room-code">Salón ${room.code}</div>
      </div>

      <div class="board">
        <div class="board-shape"></div>
        <div class="board-label">Pizarra</div>
      </div>

      <div class="seat-grid">${seatsHtml}</div>

      <div class="legend">
        <div class="legend-item">${gradIcon('legend-swatch available')}Disponible</div>
        <div class="legend-item">${gradIcon('legend-swatch reserved')}Reservado · pendiente de pago</div>
        <div class="legend-item">${gradIcon('legend-swatch occupied')}Ocupado · pagado</div>
        <div class="legend-item">${gradIcon('legend-swatch selected')}Vacante seleccionada</div>
      </div>

      <div class="confirm-bar">
        <div class="confirm-info">${barInfo}</div>
        ${barButtons}
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------
   MAIN RENDER
--------------------------------------------------------- */
function render(){
  const el = document.getElementById('screen');
  el.classList.remove('screen');
  void el.offsetWidth;
  el.classList.add('screen');

  if(state.view === 'faculties') el.innerHTML = renderFaculties();
  else if(state.view === 'careers') el.innerHTML = renderCareers();
  else if(state.view === 'schedules') el.innerHTML = renderSchedules();
  else if(state.view === 'room') el.innerHTML = renderRoom();

  renderCrumbs();
  bindEvents();
}

function bindEvents(){
  // Faculty selection
  document.querySelectorAll('[data-fac]').forEach(btn=>{
    btn.addEventListener('click', () => {
      state.facultyId = btn.getAttribute('data-fac');
      state.modality = 'presencial';
      state.view = 'careers';
      render();
    });
  });

  // Back links
  document.querySelectorAll('[data-back]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const nav = btn.getAttribute('data-back');
      if(nav === 'faculties'){ state.view='faculties'; state.facultyId=null; state.careerName=null; state.scheduleId=null; state.activeRoomKey=null; }
      if(nav === 'careers'){ state.view='careers'; state.careerName=null; state.scheduleId=null; state.activeRoomKey=null; }
      if(nav === 'schedules'){ state.view='schedules'; state.scheduleId=null; state.selectedSeat=null; state.selectedPayment=null; state.activeRoomKey=null; }
      render();
    });
  });

  // Sede tabs
  document.querySelectorAll('[data-sede]').forEach(btn=>{
    btn.addEventListener('click', () => {
      state.sede = btn.getAttribute('data-sede');
      render();
    });
  });

  // Modality tabs
  document.querySelectorAll('[data-mod]').forEach(btn=>{
    btn.addEventListener('click', () => {
      state.modality = btn.getAttribute('data-mod');
      render();
    });
  });

  // Career selection
  document.querySelectorAll('[data-career]').forEach(card=>{
    card.addEventListener('click', () => {
      state.careerName = decodeURIComponent(card.getAttribute('data-career'));
      state.view = 'schedules';
      render();
    });
  });

  // Schedule selection
  document.querySelectorAll('[data-sched]').forEach(card=>{
    card.addEventListener('click', () => {
      state.scheduleId = card.getAttribute('data-sched');
      state.selectedSeat = null;
      state.selectedPayment = null;
      state.view = 'room';
      render();
    });
  });

  // Seat clicks — libres (para reservar) y reservadas (para confirmar pago)
  document.querySelectorAll('.seat[data-status="available"], .seat[data-status="reserved"]').forEach(seatEl=>{
    seatEl.addEventListener('click', () => {
      const idx = parseInt(seatEl.getAttribute('data-seat'), 10);
      const status = seatEl.getAttribute('data-status');
      if(status === 'available'){
        state.selectedSeat = (state.selectedSeat === idx) ? null : idx;
        state.selectedPayment = null;
      } else if(status === 'reserved'){
        state.selectedPayment = (state.selectedPayment === idx) ? null : idx;
        state.selectedSeat = null;
      }
      render();
    });
  });

  // Confirmar vacante (libre → reservada, pendiente de pago, con cronómetro de 20 min)
  const confirmBtn = document.getElementById('confirmBtn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', () => {
      if(state.selectedSeat === null) return;
      const key = roomKeyFor(state.facultyId, state.careerName, state.modality, state.scheduleId, state.sede);
      const idx = state.selectedSeat;
      const seatLabel = String(idx + 1).padStart(2,'0');
      const ok = reserveSeat(key, idx);
      state.selectedSeat = null;
      state.selectedPayment = ok ? idx : null; // pasa directo a la vista de pago con cronómetro
      render();
      showToast(ok ? `Vacante ${seatLabel} reservada · tiene ${HOLD_MINUTES} min para confirmar el pago` : `Esa vacante ya fue tomada por otra persona`);
    });
  }

  // Confirmar pago (reservada → ocupada, bloqueada definitivamente)
  const confirmPayBtn = document.getElementById('confirmPayBtn');
  if(confirmPayBtn){
    confirmPayBtn.addEventListener('click', () => {
      if(state.selectedPayment === null) return;
      const key = roomKeyFor(state.facultyId, state.careerName, state.modality, state.scheduleId, state.sede);
      const idx = state.selectedPayment;
      const seatLabel = String(idx + 1).padStart(2,'0');
      const ok = confirmPayment(key, idx);
      state.selectedPayment = null;
      render();
      showToast(ok ? `Pago confirmado · vacante ${seatLabel} bloqueada` : `Esa vacante ya no está disponible para pago`);
    });
  }
}

render();
</script>
